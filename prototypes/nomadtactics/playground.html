<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NomadTactics – Spielwiese</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d8e6ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px; border-radius: 14px;
    background: rgba(28, 30, 34, 0.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.25); color: #eee; max-width: calc(100vw - 36px); }
  #bar .title { font-weight: 700; font-size: 13px; letter-spacing: .02em; padding: 0 8px 0 6px; color: #f3e7c8; }
  #bar button { font: inherit; font-size: 13px; color: #ddd; background: transparent; border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #bar button:hover { background: rgba(255,255,255,.08); }
  #bar button.on { background: rgba(240, 196, 92, .22); color: #ffd98a; }
  #bar button.red { color: #ff8a7a; } #bar button.red.on { background: rgba(255, 70, 50, .25); color: #ffb3a8; }
  #bar .sep { width: 1px; height: 22px; background: rgba(255,255,255,.15); margin: 0 4px; }
  #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(30,32,36,.7); background: rgba(255,255,255,.55); padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
  #countdown { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22vmin; font-weight: 800; color: #ff3b2a; text-shadow: 0 0 40px rgba(255,60,40,.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #flash { position: fixed; inset: 0; background: #fff8ec; opacity: 0; pointer-events: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: #555; }
</style></head><body>
<div id="load">Würfel werden gestapelt …</div>
<div id="bar">
  <span class="title">NomadTactics · Spielwiese</span>
  <button data-mode="granate" class="on">Granate</button>
  <button data-mode="rakete">Rakete</button>
  <button data-mode="super" class="red">Superwaffe</button>
  <span class="sep"></span>
  <button data-q="up" class="on">Schön</button>
  <button data-q="middle">Mittel</button>
  <button data-q="low">Schnell</button>
  <span class="sep"></span>
  <button id="new">Neu aufbauen</button>
</div>
<div id="help">Tippen/Klicken = Feuer · Ziehen = drehen · Zwei Finger/Rechtsklick = schieben · Pinch/Rad = zoomen</div>
<div id="countdown"></div>
<div id="flash"></div>
<script>/*BUNDLE*/</script>
</body></html>
